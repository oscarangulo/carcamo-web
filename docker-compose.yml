services:
  web:
    image: ghcr.io/oscarangulo/carcamo-web:latest
    # El tag es :latest, así que sin esto Coolify puede levantar una imagen vieja de su caché local.
    pull_policy: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine /etc/hosts resuelve localhost a ::1 primero, el wget de
      # busybox se va por IPv6 y Next solo bindea 0.0.0.0 => connection refused eterno.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  coolify:
    external: true
